name: Release

# Publishes to npm when a GitHub Release is published. Creating a Release
# (not merely pushing a tag) is the human-in-the-loop gate, so a stray tag
# push can never accidentally publish.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm provenance (SLSA "built from source" attestation).
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version 'v$PKG_VERSION'"
            exit 1
          fi
          echo "Tag $TAG matches package version $PKG_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check whether this version is already published
        id: package
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$PKG_VERSION is already published; skipping duplicate publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.package.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
